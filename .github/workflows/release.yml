# Builds and publishes a release when a tag "v*" is pushed (for example v0.1.0).
# The tag must match <Version> in Directory.Build.props and docs/releases/<tag>.md must exist (release text).
# Release assets: Shiftwall.exe and SHA256SUMS.txt. Debug symbols are kept as a workflow artifact.
# Versions 0.x are published as pre-releases (SemVer 2.0.0 item 4: major version zero is initial development).
# Actions are pinned to commit SHAs (tag in the comment).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: tools/build/gitleaks.sh

  release:
    name: Build and publish (Windows)
    needs: secrets
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Check tag, version and release notes
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match version $version in Directory.Build.props" }
          if (-not (Test-Path "docs/releases/$env:TAG.md")) { throw "Missing release notes docs/releases/$env:TAG.md" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test -c Release
      - name: Publish single-file exe
        run: dotnet publish src/Shiftwall.App -c Release -o publish
      - name: Version metadata
        shell: pwsh
        run: tools/build/verify-metadata.ps1 -Exe publish/Shiftwall.exe -Version "${{ steps.version.outputs.version }}"
      - name: SHA256
        shell: pwsh
        run: (Get-FileHash publish\Shiftwall.exe -Algorithm SHA256).Hash.ToLowerInvariant() + "  Shiftwall.exe" | Out-File -Encoding ascii publish\SHA256SUMS.txt
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @()
          if ($env:TAG.StartsWith('v0.')) { $flags += '--prerelease' }
          gh release create $env:TAG publish/Shiftwall.exe publish/SHA256SUMS.txt `
            --title "Shiftwall $env:TAG" --notes-file "docs/releases/$env:TAG.md" --verify-tag @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shiftwall-${{ github.ref_name }}-symbols
          path: publish/*.pdb
          retention-days: 90
