# Dependabot version updates: https://docs.github.com/code-security/dependabot/dependabot-version-updates
# NuGet versions are pinned centrally in Directory.Packages.props. Pull requests run the full CI; review the release
# notes and the license of every update (see THIRD-PARTY-NOTICES.md) before merging.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
