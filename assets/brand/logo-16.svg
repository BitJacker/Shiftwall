<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Shiftwall">
  <title>Shiftwall (16 px hinted)</title>
  <!-- Pixel-aligned simplification of logo.svg for 16x16: no motion trails. -->
  <rect width="16" height="16" rx="3.5" fill="#0A2530"/>
  <rect x=".5" y=".5" width="15" height="15" rx="3" fill="none" stroke="#5EEAD4" stroke-opacity=".35"/>
  <g fill="#2A7A8C">
    <rect x="2" y="2"  width="5" height="3"/>
    <rect x="8" y="2"  width="6" height="3"/>
    <rect x="2" y="6"  width="2" height="4"/>
    <rect x="2" y="11" width="5" height="3"/>
    <rect x="8" y="11" width="6" height="3"/>
  </g>
  <rect x="6" y="6" width="9" height="4" fill="#5EEAD4"/>
</svg>
