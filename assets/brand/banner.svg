<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>Shiftwall social preview</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06171E"/>
      <stop offset="1" stop-color="#0C3340"/>
    </linearGradient>
    <pattern id="bricks" width="96" height="48" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="44" height="20" rx="3" fill="#5EEAD4" opacity=".05"/>
      <rect x="50" y="2" width="44" height="20" rx="3" fill="#5EEAD4" opacity=".05"/>
      <rect x="-22" y="26" width="44" height="20" rx="3" fill="#5EEAD4" opacity=".05"/>
      <rect x="26" y="26" width="44" height="20" rx="3" fill="#5EEAD4" opacity=".05"/>
      <rect x="74" y="26" width="44" height="20" rx="3" fill="#5EEAD4" opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#bricks)"/>
  <!-- logo.svg scaled 4x -->
  <g transform="translate(120 192) scale(4)">
    <rect width="64" height="64" rx="14" fill="#0A2530"/>
    <rect x=".75" y=".75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#5EEAD4" stroke-opacity=".35" stroke-width="1.5"/>
    <g fill="#1F6474">
      <rect x="8" y="12" width="23" height="11" rx="2"/><rect x="34" y="12" width="22" height="11" rx="2"/>
      <rect x="8" y="26.5" width="10" height="11" rx="2"/>
      <rect x="8" y="41" width="23" height="11" rx="2"/><rect x="34" y="41" width="22" height="11" rx="2"/>
    </g>
    <g fill="#2DD4BF" opacity=".6"><rect x="21" y="28.5" width="4" height="2.5" rx="1.25"/><rect x="21" y="33" width="6" height="2.5" rx="1.25"/></g>
    <rect x="30" y="26.5" width="28" height="11" rx="2" fill="#5EEAD4"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="440" y="300" font-size="112" font-weight="700" fill="#F0FDFA" letter-spacing="-2">Shiftwall</text>
    <text x="444" y="368" font-size="34" font-weight="500" fill="#99F6E4">Offline FortiGate config migration</text>
    <text x="444" y="412" font-size="34" font-weight="500" fill="#99F6E4">&amp; sysadmin toolbox for Windows</text>
    <text x="444" y="478" font-size="22" font-weight="400" fill="#5E8C96">Single portable .exe · No telemetry · Open source</text>
  </g>
</svg>
