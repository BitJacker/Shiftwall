<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Shiftwall">
  <title>Shiftwall (24 px hinted)</title>
  <!-- Pixel-aligned simplification of logo.svg for 24x24: single motion trail. -->
  <rect width="24" height="24" rx="5" fill="#0A2530"/>
  <rect x=".5" y=".5" width="23" height="23" rx="4.5" fill="none" stroke="#5EEAD4" stroke-opacity=".35"/>
  <g fill="#236C7D">
    <rect x="3"  y="4"  width="8" height="4" rx=".5"/>
    <rect x="12" y="4"  width="9" height="4" rx=".5"/>
    <rect x="3"  y="10" width="3" height="4" rx=".5"/>
    <rect x="3"  y="16" width="8" height="4" rx=".5"/>
    <rect x="12" y="16" width="9" height="4" rx=".5"/>
  </g>
  <rect x="7" y="11.5" width="2" height="1" fill="#2DD4BF" opacity=".7"/>
  <rect x="11" y="10" width="11" height="4" rx=".5" fill="#5EEAD4"/>
</svg>
